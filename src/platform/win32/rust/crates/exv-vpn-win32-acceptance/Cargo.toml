# EXV_CUTOVER（2026-08-17）：Rust 为正式活动产品线；C++ 已弃用、仅作参考。
# cutover 记录：docs/superpowers/evidence/2026-08-17-rust-native-product-line-cutover.md；重新接线须另立 cutover requirement 并重跑真实业务流——该条件已由 2026-08-17 cutover 满足。

[package]
name = "exv-vpn-win32-acceptance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
exv-vpn-domain = { workspace = true }
exv-vpn-resource = { workspace = true }
exv-vpn-data-plane = { workspace = true }
exv-vpn-wire = { workspace = true }
exv-vpn-cstp = { workspace = true }
exv-core = { workspace = true }
exv-engine = { workspace = true }
exv-vpn-win32-ipc = { workspace = true }
exv-vpn-win32-resource = { workspace = true }
exv-vpn-win32-config = { workspace = true }
# W28 纵切：真实 TLS/CSTP 需要 rustls（版本与 Common exv-vpn-cstp 冻结一致）。
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring"] }
# W30 学校 flow：真实学校证书链验证需要平台 verifier（OS 信任存储；版本与
# Common exv-vpn-cstp 冻结一致，已在 win32 Cargo.lock 中）。
rustls-platform-verifier = "0.7.0"
tokio = { workspace = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
uuid = { workspace = true }
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Registry"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
exv-vpn-testkit = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
# R0 计时埋点（默认关闭零开销）：透传 win32-resource 的 timing feature；开启后
# acceptance 各分段（helper_apply 的 sleep/DAD/各族 + engine connect 阶段）与 resource
# 叶 seam 一起写 EXV_TIMING_FILE / %TEMP% exv-timing-<pid>.log。
timing = ["exv-vpn-win32-resource/timing"]

[lints]
workspace = true

