[package]
name = "exv-ui"
version = "0.1.0"
description = "EXV VPN desktop UI (Tauri v2). Frontend: Vue3 + Vite + TS. UI<->core via Tauri Command/Event (Phase 4, P4-b real KernelControl gRPC wiring)."
authors = ["HiderWild"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

# P4-b：core KernelControl gRPC client 依赖（版本与核心 workspace 同 0.14.x）。
tonic = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
windows = { workspace = true }
# 复用 core 侧 proto 生成代码（KernelControl client + wire 消息类型）。
exv-vpn-wire = { workspace = true }
exv-vpn-win32-resource = { workspace = true }
